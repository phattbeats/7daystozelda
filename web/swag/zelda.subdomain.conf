## Ocarina Co-op (Ship of Harkinian True Co-op, browser build)
# https://zelda.phatt.vip -> soh-web:8080
#
# Copy to SWAG's /config/nginx/proxy-confs/ and restart SWAG.
# Needs: a proxied Cloudflare CNAME `zelda` -> phatt.vip (the *.phatt.vip
# wildcard cert already covers it), and the soh-web container on the same
# Docker network as SWAG (docker-compose.yml joins it). $upstream_app is the
# container name, resolved lazily, so SWAG still starts while soh-web is down.
# Container names are case-sensitive here: keep it lowercase.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name zelda.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # One location covers the page, the game files and the /anchor co-op relay.
    # SWAG's proxy.conf already passes WebSocket upgrades. Its 240 s timeouts
    # stay as they are: the relay pings every 25 s, which also keeps Cloudflare
    # (100 s idle limit) from cutting the connection. Do not add
    # proxy_read_timeout here: proxy.conf sets it, and a duplicate stops SWAG
    # from starting at all.
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app soh-web;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
