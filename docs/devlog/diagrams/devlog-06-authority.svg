<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="monospace" font-size="13">
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="8" y="8" width="784" height="464" fill="none" stroke="#1b2440" stroke-width="1.5"/>
  <text x="24" y="34" font-size="15" font-weight="bold" fill="#1b2440">FIG 6-5  TWO AUTHORITIES, ONE BARRICADE HIT</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2440"/></marker></defs>
  <g fill="none" stroke="#1b2440" stroke-width="1.5">
    <rect x="40" y="70" width="220" height="120"/>
    <rect x="540" y="70" width="220" height="120" stroke="#c9a227" stroke-width="3"/>
    <rect x="290" y="330" width="220" height="100"/>
  </g>
  <g fill="#1b2440">
    <text x="52" y="94" font-weight="bold">SCENE ENEMY AUTHORITY</text>
    <text x="52" y="114">lowest clientId in scene</text>
    <text x="52" y="134">runs: budget, spawns,</text>
    <text x="52" y="152">routing, stuck check,</text>
    <text x="52" y="170">barricade drain</text>
    <text x="552" y="94" font-weight="bold">ROOM OWNER</text>
    <text x="552" y="114">roomState.ownerClientId</text>
    <text x="552" y="134">owns: BaseState, pool,</text>
    <text x="552" y="152">night schedule, dawn,</text>
    <text x="552" y="170">penalties, rev counter</text>
    <text x="302" y="354" font-weight="bold">EVERY OTHER CLIENT</text>
    <text x="302" y="374">applies BASE_DELTA if</text>
    <text x="302" y="392">rev == mine + 1, else</text>
    <text x="302" y="410">asks for BASE_STATE</text>
  </g>
  <g stroke="#1b2440" stroke-width="1.3" fill="none">
    <path d="M260 110 L538 110" marker-end="url(#a)"/>
    <path d="M538 150 L262 150" stroke-dasharray="5 3" marker-end="url(#a)"/>
    <path d="M620 192 L470 328" marker-end="url(#a)"/>
    <path d="M150 192 L300 328" stroke-dasharray="5 3" marker-end="url(#a)"/>
  </g>
  <g fill="#1b2440" font-size="12">
    <text x="300" y="102">1  BASE_HP {id, hp}</text>
    <text x="300" y="168">3  BASE_DELTA {rev, op:"hp"}</text>
    <text x="560" y="270">2  BASE_DELTA {rev+1}</text>
    <text x="40" y="270">HORDE_EVENT (same scene)</text>
    <text x="40" y="286">status, night, dayTime</text>
  </g>
  <text x="24" y="462" font-size="11" fill="#1b2440">Solo: one client is both. Owner and authority are often the same player, but need not be.</text>
</svg>
