<text x="30" y="85">True Co-op b738c76</text><text x="30" y="105">+ patches 0001-0019</text><text x="30" y="120">+ submodule patches</text>
<text x="240" y="85">emcmake cmake</text><text x="240" y="105">-G Ninja Release</text><text x="240" y="120">BUILD_FOR_WEB</text>
<text x="450" y="85">randomizer TUs</text><text x="450" y="105">ninja -j1</text><text x="450" y="120">5+ GB each</text>
<text x="640" y="85">ninja -j4 soh</text><text x="640" y="105">soh.html/js/</text><text x="640" y="120">wasm/data</text>
<text x="20" y="175">-O1  : builds, ~12 GB RAM+swap for a first build</text>
<text x="20" y="195">-O0  : "too many locals" (wasm 50,000-local limit), browsers refuse to load</text>
<text x="20" y="215">shell.html edit only: rm build-web/soh/soh.html, relink ~30 s</text>
<text x="20" y="235">single-threaded: no receive thread, WebSocket inbox drained on the game thread</text>
